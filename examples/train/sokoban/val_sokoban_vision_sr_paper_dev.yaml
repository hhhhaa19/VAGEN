# Development set for the verification settings: 128 eval-partition seeds
# from 12000 to 13349, no room equal to a test room. Generated by
# experiments/verify/make_dev_seeds.py; everything except the seeds is the test config.
envs:
  - name: Sokoban
    n_envs: 128
    data_source: sokoban
    seed_list: [
      12000, 12002, 12015, 12019, 12020, 12028, 12040, 12068, 12079, 12080, 12090, 12091, 12107, 12132, 12149, 12172,
      12181, 12190, 12208, 12214, 12232, 12260, 12266, 12273, 12299, 12304, 12310, 12321, 12324, 12331, 12343, 12346,
      12359, 12370, 12401, 12423, 12433, 12441, 12467, 12469, 12471, 12476, 12489, 12495, 12507, 12511, 12512, 12518,
      12543, 12545, 12553, 12572, 12582, 12602, 12605, 12632, 12635, 12637, 12639, 12652, 12654, 12695, 12696, 12701,
      12705, 12708, 12723, 12739, 12747, 12748, 12755, 12766, 12767, 12785, 12790, 12802, 12805, 12813, 12819, 12833,
      12873, 12875, 12877, 12908, 12919, 12921, 12946, 12972, 12974, 12985, 13005, 13013, 13020, 13021, 13029, 13040,
      13041, 13058, 13077, 13080, 13091, 13092, 13104, 13120, 13135, 13138, 13139, 13159, 13163, 13171, 13172, 13192,
      13194, 13195, 13196, 13221, 13246, 13260, 13262, 13263, 13271, 13280, 13302, 13310, 13318, 13328, 13331, 13349,
    ]
    max_turns: 3
    response_length_per_turn: 512
    max_env_response_per_turn: 256
    config:
      render_mode: vision
      strict_format: true
      format_reward: 0.5
      use_env_reward: true
      min_solution_steps: [1,5]
      map_partition: eval
      map_partition_modulus: 4
      map_partition_eval_bucket: 0
      state_reward:
        state_estimation:      {enable: true, reward: '${oc.env:STATE_ESTIMATION_REWARD,0.03}'}
        transition_prediction: {enable: true, reward: '${oc.env:TRANSITION_PREDICTION_REWARD,0.03}'}
        score_base: ${oc.env:STATE_REWARD_SCORE_BASE,0.334}
        credit_site: ${oc.env:STATE_REWARD_CREDIT_SITE,section_end}
        aggregation: ${oc.env:STATE_REWARD_AGGREGATION,per_turn}
        scorer: ${oc.env:STATE_REWARD_SCORER,judge}
        judge_base_url: ${oc.env:JUDGE_BASE_URL,http://127.0.0.1:8123/v1}
        judge_model: ${oc.env:JUDGE_MODEL,Qwen/Qwen3-4B-Instruct-2507}
